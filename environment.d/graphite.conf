# Graphite: give every app (systemd-launched, D-Bus-activated, or from Hyprland)
# the Qt platform theme, so Qt/KDE apps like Dolphin use qt6ct's graphite
# palette, fonts and icons instead of Qt's light default.
QT_QPA_PLATFORMTHEME=qt6ct
QT_QPA_PLATFORM=wayland;xcb
XCURSOR_THEME=Bibata-Modern-Ice
XCURSOR_SIZE=24
