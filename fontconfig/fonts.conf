<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Graphite: the bar's typefaces become the system defaults.
     Graphite Sans / Graphite Mono are static cuts of Recursive (~/.local/share/fonts/Graphite).
     Noto stays as the fallback for scripts and symbols Recursive doesn't cover. -->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Graphite Sans</family><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Graphite Mono</family><family>Noto Sans Mono</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Graphite Sans</family></prefer>
  </alias>
</fontconfig>
