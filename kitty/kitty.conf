# Graphite: Graphite Mono, padding in step with the bar, flat square tab bar.
# Colors come from the Noctalia template (themes/noctalia.conf).
font_family                 Graphite Mono
bold_font                   Graphite Mono Bold
italic_font                 Graphite Mono Italic
bold_italic_font            Graphite Mono Bold Italic
font_size                   11.0
modify_font                 cell_height 115%

background_opacity          0.6
cursor_trail                1
cursor_shape                block
window_padding_width        12

tab_bar_edge                top
tab_bar_style               separator
tab_separator               " "
tab_title_template          " {index} {title} "
active_tab_font_style       bold
inactive_tab_font_style     normal


# Close windows and tabs without asking, even with a program running
confirm_os_window_close 0
include themes/noctalia.conf
