config_version = 16

[bar.default]
capsule_group = []
center = [ "clock" ]
end = [ "media", "spacer_1", "tray", "notifications", "network", "bluetooth", "volume", "session" ]
margin_edge = 6
margin_ends = 120
radius = 30
radius_bottom_left = 30
radius_bottom_right = 30
radius_top_left = 30
radius_top_right = 30
scale = 1.0000000074505806
start = [ "workspaces", "spacer_1", "active_window" ]
thickness = 32

[bluetooth]
connect_when_enabled = true
connection_notifications = true

[brightness]
sync_all_monitors = true

[control_center]
hidden_tabs = [ "weather", "calendar", "notifications", "screen-time" ]

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 720.0
    cy = 718.0
    output = "eDP-2"
    placement_height = 900.0
    placement_width = 1440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-2".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = []

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
font_family = "URW Gothic"
telemetry_enabled = true

    [shell.animation]
    speed = 0.80000001192092896

    [shell.launcher]
    default_view = "all"

    [shell.panel]
    transparency_mode = "soft"

    [shell.screenshot]
    copy_on_close = true
    copy_to_clipboard = true
    directory = "/home/vyeos/Pictures"
    skip_annotate_on_copy_save = true

[system.monitor]
enabled = false

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/vyeos/Downloads"

    [wallpaper.default]
    path = "/home/vyeos/Downloads/___==__.jpg"

    [wallpaper.last]
    path = "/home/vyeos/Downloads/___==__.jpg"

    [wallpaper.monitors.eDP-2]
    path = "/home/vyeos/Downloads/___==__.jpg"

[widget.clock]
format = "{:%H:%M %a %d %m}"