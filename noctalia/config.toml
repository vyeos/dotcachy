[notification]
offset_y = 20
scale = 0.85
show_app_name = false
width = 300

[osd]
offset_y = 20

[plugins]
enabled = [ "vyeos/graphite" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "/home/vyeos/.config/noctalia/plugins-local"
    name = "local"

[shell]
clipboard_enabled = false   # graphite's clip panel keeps the history
corner_radius_scale = 0
font_family = "Graphite Sans"
polkit_agent = true
settings_show_advanced = true

    [shell.animation]
    speed = 1.0

    [shell.greeter_sync]
    auto_sync = false       # see greeter/install.sh

    [shell.panel]
    transparency_mode = "soft"

    [shell.screenshot]
    annotate = false
    copy_on_close = true
    copy_to_clipboard = false
    pipe_command = "/home/vyeos/.local/bin/graphite-shot"
    pipe_to_command = true
    save_to_file = false
    skip_annotate_on_copy_save = true

[system.monitor]
enabled = false

[theme]
custom_palette = "Graphite"
mode = "dark"
pure_black_dark = false
source = "custom"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt" ]

[wallpaper]
directory = "/home/vyeos/Downloads"

    [wallpaper.default]
    path = "/home/vyeos/Downloads/wallhaven-5ypy88.jpg"

