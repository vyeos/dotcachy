# Graphite rice: flat, square, monochrome. This is the whole shell configuration.
# ~/.local/state/noctalia/settings.toml overrides it, but only holds what the shell
# records at runtime (wallpaper paths, anything set with `noctalia msg config-set`).
# Apply changes with: noctalia msg config-reload

[accessibility]
ui_scale = 1.0

[bar.default]
start = [ "vyeos/graphite:logo", "vyeos/graphite:workspaces", "vyeos/graphite:window" ]
center = [ "vyeos/graphite:clock" ]
end = [
    "vyeos/graphite:status",
    "vyeos/graphite:tasks",
    "vyeos/graphite:wifi",
    "vyeos/graphite:bluetooth",
    "vyeos/graphite:audio",
    "vyeos/graphite:gpu",
    "vyeos/graphite:battery",
    "vyeos/graphite:notifications"
]
thickness = 38
scale = 1.0
padding = 10
widget_spacing = 2
font_family = "Graphite Sans"
hover_highlight = false
border = "outline_variant"
border_width = 1
margin_edge = 0
margin_ends = 6        # lines the bar's sides up with Hyprland's gaps_out
radius = 0
radius_top_left = 0
radius_top_right = 0
radius_bottom_left = 0
radius_bottom_right = 0
concave_edge_corners = true

[bluetooth]
connect_when_enabled = true
connection_notifications = true

[brightness]
sync_all_monitors = true

[lockscreen]
blur_intensity = 0.7
tint_intensity = 0.5
transition = [ "melt" ]
transition_duration = 400

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-widget-time", "lockscreen-widget-date", "lockscreen-widget-user", "lockscreen-login-box@eDP-2", "lockscreen-power", "lockscreen-widget-time-mux", "lockscreen-widget-date-mux", "lockscreen-widget-user-mux", "lockscreen-login-box@eDP-1", "lockscreen-power-mux" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-2"]
    box_height = 128.0
    box_width = 320.0
    cy = 660.0
    cx = 720.0
    output = "eDP-2"
    placement_height = 900.0
    placement_width = 1440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-2".settings]
        background_color = "surface"
        background_opacity = 0.0
        background_radius = 0.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 0.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = false
        show_password_reveal = false
        show_session_buttons = false
        show_unlock_hint = false
        show_weather = false

    [lockscreen_widgets.widget.lockscreen-power]
    box_height = 0.0
    box_width = 0.0
    cy = 846.0
    cx = 720.0
    output = "eDP-2"
    placement_height = 900.0
    placement_width = 1440.0
    rotation = 0.0
    type = "vyeos/graphite:lock-power"

        [lockscreen_widgets.widget.lockscreen-power.settings]
        background = false

    [lockscreen_widgets.widget.lockscreen-widget-date]
    box_height = 30.0
    box_width = 300.0
    cy = 330.0
    cx = 720.0
    output = "eDP-2"
    placement_height = 900.0
    placement_width = 1440.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-date.settings]
        background = false
        center_text = true
        clock_style = "digital"
        color = "on_surface_variant"
        font_family = "Graphite Mono"
        format = "{:%A  %d %B %Y}"
        shadow = false

    [lockscreen_widgets.widget.lockscreen-widget-time]
    box_height = 150.0
    box_width = 460.0
    cy = 240.0
    cx = 720.0
    output = "eDP-2"
    placement_height = 900.0
    placement_width = 1440.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-time.settings]
        background = false
        center_text = true
        clock_style = "digital"
        color = "on_surface"
        font_family = "Graphite Mono"
        format = "{:%H:%M}"
        shadow = false

    [lockscreen_widgets.widget.lockscreen-widget-user]
    box_height = 0.0
    box_width = 0.0
    cy = 430.0
    cx = 720.0
    output = "eDP-2"
    placement_height = 900.0
    placement_width = 1440.0
    rotation = 0.0
    type = "label"

        [lockscreen_widgets.widget.lockscreen-widget-user.settings]
        background = false
        color = "on_surface"
        description = "vyeos@cachyos"
        font_family = "Graphite Sans"
        shadow = false
        title = "Rudra Patel"

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
