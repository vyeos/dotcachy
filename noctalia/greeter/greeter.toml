# Graphite login screen for noctalia-greeter.
# Source of truth: ~/.config/noctalia/greeter/greeter.toml
# Installed to /var/lib/noctalia-greeter/greeter.toml by ./install.sh (needs sudo).
# Palette mirrors ~/.config/noctalia/palettes/Graphite.json (dark).

[session]
default = "Hyprland"

[user]
default = "vyeos"

[appearance]
scheme = "Synced"
theme_mode = "dark"
corner_radius_scale = 0.0          # square corners everywhere
font_family = "Graphite Sans"      # installed system-wide by install.sh
password_style = "default"
hide_logo = true                   # no Noctalia brand mark
scheme_selector_position = "hidden"
power_buttons_position = "bottom-right"

[appearance.palette]
primary = "#d3d6d9"
on_primary = "#151618"
secondary = "#a6abb1"
on_secondary = "#151618"
tertiary = "#7a7f86"
on_tertiary = "#ededeb"
error = "#c9a3a0"
on_error = "#151618"
surface = "#151618"
on_surface = "#ededeb"
surface_variant = "#1c1d20"
on_surface_variant = "#a6abb1"
outline = "#33363a"
shadow = "#0e0f10"
hover = "#26282b"
on_hover = "#ededeb"

[appearance.wallpaper]
path = "/var/lib/noctalia-greeter/wallpaper.jpg"
fill_mode = "crop"
fill_color = "#0e0f10"

[clock]
enabled = true
position = "above-panel"
time_format = "{:%H:%M}"
date_format = "%a %d %b"           # same fields as the bar clock
time_font_size = 56
date_font_size = 13
